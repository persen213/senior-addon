// Mental Out add-on for Re:AcademyCraft 1.5.0 (Minecraft 1.20.1 / Forge 47.4.10).
// Build setup copied from the official sample add-on (samples/academy-api-example).
plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

group = 'com.toaru.senior'
version = '0.1.0'
base { archivesName = 'senior-forge-1.20.1' }

java { toolchain.languageVersion = JavaLanguageVersion.of(17) }

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true
}

repositories {
    // The Re:AcademyCraft API jar from the SDK, kept in the libs folder.
    flatDir { dirs 'libs' }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.10'
    // Compile against the public API jar only. It is NOT packed into our jar:
    // at runtime the real Re:AcademyCraft mod must be installed.
    implementation fg.deobf('blank:re-academycraft-forge-1.20.1:1.5.0:api')
}

tasks.named('processResources', ProcessResources) {
    filteringCharset = 'UTF-8'
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') { expand 'version': project.version }
}

tasks.named('jar', Jar) {
    finalizedBy 'reobfJar'
}
